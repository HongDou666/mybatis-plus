spring:
  application:
    name: mybatis-plus
  datasource:
    # MySQL 连接地址（库名 mybatis_plus）
    # rewriteBatchedStatements=true：批处理时重写为多值 SQL，提升 saveBatch 等批量写入性能
    url: jdbc:mysql://127.0.0.1:3306/mybatis_plus?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

# 日志：业务包 debug，便于观察 Mapper / SQL 相关输出
logging:
  level:
    com.zqc: debug
  pattern:
    dateformat: HH:mm:ss

mybatis-plus:
  # Mapper XML 扫描路径
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类别名包（XML 中可写简短类名，如 User）
  type-aliases-package: com.zqc.domain.po
  configuration:
    # 表字段下划线 ↔ 实体驼峰（create_time ↔ createTime）
    map-underscore-to-camel-case: true
    # 开发期控制台打印 SQL（生产环境建议去掉，改用 logging.level）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 枚举默认处理器：带 @EnumValue / IEnum 的枚举会与库字段自动转换（一般无需改）
    # default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    # JSON 字段（如 User.info）在实体上用 @TableField(typeHandler = JacksonTypeHandler.class)
    # 并配合 @TableName(autoResultMap = true)，无需在此全局注册 typeHandler
  global-config:
    db-config:
      # 全局主键策略：雪花算法（实体未单独指定时生效）
      id-type: assign_id
      # 更新策略：非空字段才更新（避免默认值被覆盖）
      update-strategy: not_empty
      # 全局逻辑删除字段名（实体仍可用 @TableLogic 标注；与全局配置一致即可）
      logic-delete-field: deleted
      # 已删除取值
      logic-delete-value: 1
      # 未删除取值
      logic-not-delete-value: 0

# Knife4j / springdoc 接口文档（浏览器访问：http://localhost:8080/doc.html）
springdoc:
  swagger-ui:
    # 原生 Swagger UI 路径（一般用 Knife4j 的 doc.html 即可）
    path: /swagger-ui.html
    # 标签按字母排序
    tags-sorter: alpha
    # 接口按字母排序
    operations-sorter: alpha
  api-docs:
    # OpenAPI JSON 地址
    path: /v3/api-docs
  group-configs:
    - group: default
      # 文档包含的路径范围
      paths-to-match: /**
      # 只扫描 Controller 包，避免无关类进文档
      packages-to-scan: com.zqc.controller

knife4j:
  # 开启 Knife4j 增强文档（false 则无 doc.html）
  enable: true
  setting:
    # 文档界面语言：中文
    language: zh_cn
  # 生产环境可设 production: true 关闭文档页面
